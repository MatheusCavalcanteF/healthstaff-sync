spring:
  application:
    name: healthstaff-backend
  config:
    # O mesmo .env do docker-compose (raiz do repositório), se existir.
    import: optional:file:../.env[.properties]
  datasource:
    # Mesmas variáveis do serviço postgres do docker-compose.yml (um único .env).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthstaff}
    username: ${POSTGRES_USER:healthstaff}
    password: ${POSTGRES_PASSWORD:}
  servlet:
    multipart:
      # Mesmo limite do extrator (EXTRACTOR_MAX_UPLOAD_MB): recusa cedo, antes de repassar.
      max-file-size: ${EXTRACTOR_MAX_UPLOAD_MB:20}MB
      max-request-size: ${EXTRACTOR_MAX_UPLOAD_MB:20}MB
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é do Flyway (db/migration); o Hibernate só confere se as entidades batem.
      ddl-auto: validate

server:
  port: ${PORT:8080}
  tomcat:
    # Ao recusar um upload acima do limite, o Tomcat só descarta 2 MB do resto do
    # corpo (padrão) e fecha a conexão: o navegador veria erro de rede em vez do 413.
    # Descartar até 100 MB garante a resposta "arquivo muito grande" sem ler sem fim.
    max-swallow-size: 100MB

healthstaff:
  security:
    jwt:
      # Obrigatória, sem padrão (o backend não sobe sem ela): pelo menos 32 bytes.
      # Gere com: openssl rand -base64 48
      secret: ${HEALTHSTAFF_JWT_SECRET:}
      expiracao: ${HEALTHSTAFF_JWT_EXPIRACAO:8h}   # um turno; depois, novo login
    login:
      # Freio contra força bruta, por e-mail: depois de N tentativas sem acerto, 429 com
      # Retry-After; o bloqueio dobra a cada nova tentativa errada, até o máximo.
      tentativas-livres: 5
      bloqueio-inicial: 1m
      bloqueio-maximo: 15m
      esquecer-apos: 1h                          # sem tentativas por esse tempo, a contagem zera
    admin-inicial:
      # Criado na subida só se não houver nenhum ADMIN ativo; depois é ignorado.
      nome: ${HEALTHSTAFF_ADMIN_NOME:Administrador}
      email: ${HEALTHSTAFF_ADMIN_EMAIL:}
      senha: ${HEALTHSTAFF_ADMIN_SENHA:}

  cors:
    # Origens do frontend (Next.js). Em produção, o domínio real (variável CORS_ORIGENS, separadas por vírgula).
    origens-permitidas: ${CORS_ORIGENS:http://localhost:3000}

  extrator:
    # python-extractor (docker compose up na raiz expõe em 127.0.0.1:8000)
    url: ${EXTRACTOR_URL:http://localhost:8000}
    api-key: ${EXTRACTOR_API_KEY:}
    timeout-conexao: 5s
    timeout-leitura: 120s   # extração (arquivos grandes demoram)
    timeout-saude: 3s       # GET /health do healthcheck: conexão e resposta

  regras:
    # Motor de regras (valores padrão; ajuste conforme a política do hospital).
    descanso-minimo-interjornada: 11h     # CLT art. 66
    intervalo-maximo-mesma-jornada: 2h    # plantões com pausa até isso = uma jornada (ex.: M/T)
    jornada-maxima: 12h                   # acima disso, plantões emendados geram alerta (dobra)
    saldo-alto: 20h
    saldo-baixo: -10h
    cargas-mensais:                       # jornadas "NNH" usam NN x 5 (divisor CLT)
      12X36: 180h
    dias-ausencia-para-zerar-carga: 28    # férias/licença/afastamento >= isso no mês: carga esperada 0
    folga-organizacional:                 # FG não reduz a carga: credita jornada cumprida
      credito-por-folga: 12h
      enfermeiro: 2                       # FGs creditáveis por mês
      tecnico-enfermagem: 1
      administrativo: 1
      outros: 1                           # cargo não reconhecido

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Anônimo e perfis não-ADMIN recebem só o status (e os nomes dos grupos de probes);
      # componentes e detalhes (inclusive o do extrator) só com token de ADMIN.
      show-components: when-authorized
      show-details: when-authorized
      roles: ADMIN
      # Sem cache do Actuator (management.endpoint.health.cache): ele é por usuário e
      # ignorado com parâmetros na URL. O ExtratorHealthIndicator guarda o último
      # resultado por 10s para qualquer requisição e consulta o extrator uma vez por vez.
