spring:
  application:
    name: healthstaff-backend

server:
  port: ${PORT:8080}

healthstaff:
  extrator:
    # python-extractor (docker compose up na raiz expõe em 127.0.0.1:8000)
    url: ${EXTRACTOR_URL:http://localhost:8000}
    api-key: ${EXTRACTOR_API_KEY:}
    timeout-conexao: 5s
    timeout-leitura: 120s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: when-authorized
