# Integração contínua: os três módulos em paralelo, a cada push na main e em
# todo pull request para a main. Versões iguais às de produção/desenvolvimento:
# Java 25 (pom.xml), Python 3.13 (Dockerfile) e Node.js 24 LTS (CONTRIBUTING.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O workflow só lê o código; nenhum job precisa de escrita no repositório.
permissions:
  contents: read

# Push novo no mesmo PR cancela a execução anterior; na main, todas terminam.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-backend:
    name: java-backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: java-backend
    steps:
      # Checkout completo: o build gera as classes do contrato a partir de
      # ../python-extractor/schema/openapi.json.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: java-backend/pom.xml

      # Os testes sobem um Postgres 18 embutido (io.zonky), sem Docker.
      # ExtratorE2ETest fica pulado: só roda com EXTRACTOR_E2E_URL definida.
      - name: Build e testes
        run: ./mvnw verify -B --no-transfer-progress

      - name: Relatórios dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: java-backend/target/surefire-reports/
          retention-days: 7

  python-extractor:
    name: python-extractor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-extractor
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python-extractor/requirements.txt
            python-extractor/requirements-dev.txt

      # requirements-dev.txt inclui o requirements.txt (-r).
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt

      # Os testes com arquivos reais (LGPD, fora do Git) se pulam sozinhos.
      - name: Testes
        run: python -m pytest

      # O Java gera o cliente a partir do schema versionado: modelo alterado sem
      # regenerar (python -m api.schema) faria o backend compilar contra um
      # contrato velho.
      - name: Contrato versionado em dia
        run: |
          python -m api.schema
          git diff --exit-code -- schema/ || {
            echo "::error::schema/ desatualizado: rode 'python -m api.schema' em python-extractor/ e versione o resultado"
            exit 1
          }

  next-frontend:
    name: next-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # Inclui a checagem de tipos do TypeScript.
      - name: Build
        run: npm run build
